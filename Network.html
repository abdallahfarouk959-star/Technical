  {"id": "C2-23", "category": "Ch. 2 (Lec 7–8): Application Layer & HTTP", "q": "What is the full form of HTTP, the Web's application-layer protocol primarily used for browsing web pages?", "code": "", "opts": ["A. HyperText Transfer Protocol", "B. HyperText Transfer Package", "C. Hyper Transfer Text Package", "D. Hyper Transfer Text Practice"], "ans": [0], "multi": false, "why": "HTTP stands for HyperText Transfer Protocol.", "added": false},
  {"id": "C2-24", "category": "Ch. 2 (Lec 7–8): Application Layer & HTTP", "q": "HTTP is a __________ protocol because the server maintains no information about past client requests.", "code": "", "opts": ["A. Stateless", "B. Stateful", "C. Connectionless", "D. Circuit-switched"], "ans": [0], "multi": false, "why": "An HTTP server does not store session history of previous client requests, making HTTP a stateless protocol.", "added": false},

  {"id": "C2-27", "category": "Ch. 2 (Lec 7–8): Application Layer & HTTP", "q": "The time for a small packet to travel from client to server and back is called __________.", "code": "", "opts": ["A. Response time", "B. Request time", "C. RTT (Round Trip Time)", "D. Transmission delay"], "ans": [2], "multi": false, "why": "RTT (Round Trip Time) is the round-trip propagation/queuing/processing time for a small packet to go from client to server and return.", "added": false},
  {"id": "C2-28", "category": "Ch. 2 (Lec 7–8): Application Layer & HTTP", "q": "The non-persistent HTTP response time to fetch a single file equals __________ plus the file transmission time.", "code": "", "opts": ["A. 2 RTT", "B. 1 RTT", "C. 3 RTT", "D. 0.5 RTT"], "ans": [0], "multi": false, "why": "Non-persistent HTTP requires 1 RTT to open the TCP connection plus 1 RTT to send the HTTP request and receive the start of the response, totaling 2 RTT + file transmission time.", "added": false},

];
const TOPICS = [...new Set(Q.map((q) => q.category))];

const KEY = "network-midterm-quiz-v2";
const LETTERS = "ABCD";
const $ = (id) => document.getElementById(id);
const byId = Object.fromEntries(Q.map((q) => [q.id, q]));

const stripOpt = (s) => s.replace(/^[A-E]\.\s*/, "");

function buildOptOrder(q) {
  const n = q.opts.length;
  if (n === 2 && /^True$/i.test(stripOpt(q.opts[0])) && /^False$/i.test(stripOpt(q.opts[1]))) {
    return [0, 1];
  }
  const free = [];
  const pinned = [];
  for (let i = 0; i < n; i++) {
    const t = stripOpt(q.opts[i]);
    if (/^(all of|none of|both\b)/i.test(t)) pinned.push(i);
    else free.push(i);
  }
  for (let i = free.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [free[i], free[j]] = [free[j], free[i]];
  }
  return [...free, ...pinned];
}

function makeAllOptOrders() {
  const map = {};
  Q.forEach((q) => { map[q.id] = buildOptOrder(q); });
  return map;
}

const fresh = () => ({
  topic: "all", mode: "practice", graded: false, only: null,
  i: 0, order: Q.map((q) => q.id), optOrder: makeAllOptOrders(), sel: {}, done: {}
});
let S = fresh();
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && Array.isArray(saved.order) && saved.order.length === Q.length &&
      saved.order.every((id) => byId[id])) {
    S = { ...S, ...saved };
    if (!S.optOrder || typeof S.optOrder !== "object") S.optOrder = makeAllOptOrders();
    Q.forEach((q) => {
      if (!Array.isArray(S.optOrder[q.id]) || S.optOrder[q.id].length !== q.opts.length) {
        S.optOrder[q.id] = buildOptOrder(q);
      }
    });
  }
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const esc = (s) => s.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
const answered = (q) => (S.sel[q.id] || []).length > 0;
const isRight = (q) => {
  const s = S.sel[q.id] || [];
  return s.length === q.ans.length && q.ans.every((a) => s.includes(a));
};
const revealed = (q) => (S.mode === "practice" ? !!S.done[q.id] : S.graded);
const scope = () => S.order.map((id) => byId[id]).filter((q) => S.topic === "all" || q.category === S.topic);
const visible = () => scope().filter((q) => !S.only || S.only.includes(q.id));
const missed = () => scope().filter((q) => revealed(q) && !isRight(q));
const letterList = (q, arr) => {
  const ord = S.optOrder[q.id] || q.opts.map((_, i) => i);
  const l = arr.map((origIdx) => ord.indexOf(origIdx)).sort((a, b) => a - b).map((pos) => LETTERS[pos]);
  return l.length < 3 ? l.join(" and ") : l.slice(0, -1).join(", ") + " and " + l[l.length - 1];
};

function render() {
  const list = visible();
  if (S.i >= list.length) S.i = Math.max(0, list.length - 1);
  renderToolbar();
  renderSummary();
  renderStatus(list);
  renderCard(list);
  renderNav(list);
  renderGrid(list);
  $("f-missed").textContent = S.only ? "Show all questions" : "Missed only";
  $("f-missed").disabled = !S.only && missed().length === 0;
}

function renderToolbar() {
  const count = (t) => Q.filter((q) => q.category === t).length;
  $("topic").innerHTML =
    `<option value="all">All topics (${Q.length})</option>` +
    TOPICS.map((t) => `<option value="${esc(t)}">${esc(t)} (${count(t)})</option>`).join("");
  $("topic").value = S.topic;
  $("m-practice").setAttribute("aria-pressed", S.mode === "practice");
  $("m-exam").setAttribute("aria-pressed", S.mode === "exam");
}

function renderSummary() {
  const el = $("summary");
  const all = scope();
  if (S.only) {
    el.innerHTML = `<p class="note">Showing ${S.only.length} missed question${S.only.length === 1 ? "" : "s"}.</p>`;
    return;
  }
  const finished = all.length > 0 && (S.mode === "exam" ? S.graded : all.every((q) => S.done[q.id]));
  if (!finished) { el.innerHTML = ""; return; }
  const right = all.filter(isRight).length;
  const miss = missed().length;
  el.innerHTML = `<div class="summary">
    <p class="big">${right} of ${all.length} correct (${Math.round((right / all.length) * 100)}%)</p>
    <div class="actions">
      ${miss ? `<button type="button" class="btn primary" data-act="review">Review ${miss} missed</button>` : ""}
      <button type="button" class="btn" data-act="restart">Start over</button>
    </div></div>`;
}

function renderStatus(list) {
  const n = list.length;
  $("pos").textContent = n ? `Question ${S.i + 1} of ${n}` : "";
  const counted = S.mode === "practice" ? list.filter((q) => S.done[q.id]) : list.filter(answered);
  if (S.mode === "practice" || S.graded) {
    const shown = list.filter(revealed);
    $("score").textContent = shown.length ? `${shown.filter(isRight).length} of ${S.mode === "exam" ? n : shown.length} correct` : "";
  } else {
    $("score").textContent = `${counted.length} of ${n} answered`;
  }
  $("fill").style.width = n ? `${(counted.length / n) * 100}%` : "0";
}

function renderCard(list) {
  const card = $("card");
  if (!list.length) { card.innerHTML = `<p class="note">No questions to show.</p>`; return; }
  const q = list[S.i];
  const sel = S.sel[q.id] || [];
  const rev = revealed(q);
  const ord = S.optOrder[q.id] || q.opts.map((_, i) => i);
  const opts = ord.map((origIdx, pos) => {
    const picked = sel.includes(origIdx);
    const right = q.ans.includes(origIdx);
    let cls = "opt" + (q.multi ? " multi" : "") + (picked ? " picked" : "");
    let tag = "", mark = "";
    if (rev && right) { cls += " right"; tag = picked ? "Correct" : "Correct answer"; mark = "✓"; }
    else if (rev && picked) { cls += " wrong"; tag = "Your answer"; mark = "✕"; }
    const label = `${LETTERS[pos]}. ${stripOpt(q.opts[origIdx])}`;
    return `<button type="button" class="${cls}" data-k="${origIdx}" data-pos="${pos}" aria-pressed="${picked}">
      <span class="key">${mark}</span>
      <span class="txt">${esc(label)}${tag ? `<span class="tag">${tag}</span>` : ""}</span>
    </button>`;
  }).join("");

  let why = "";
  if (rev) {
    const ok = isRight(q);
    const lead = ok ? "Correct."
      : `${answered(q) ? "Incorrect." : "Not answered."} The answer${q.ans.length > 1 ? "s are" : " is"} ${letterList(q, q.ans)}.`;
    why = `<div class="why ${ok ? "ok" : "bad"}"><p class="verdict">${lead}</p><p>${esc(q.why)}</p></div>`;
  }

  card.innerHTML = `
    <p class="cap"><span>${esc(q.category)}</span><span>${q.added ? "Added question " : ""}${esc(q.id)}</span></p>
    <h2 class="q">${esc(q.q)}</h2>
    ${q.code ? `<pre><code>${esc(q.code)}</code></pre>` : ""}
    <div class="opts${rev ? " locked" : ""}" role="group" aria-label="Answer options">${opts}</div>
    ${why}`;
}

function renderNav(list) {
  if (!list.length) { $("nav").innerHTML = ""; return; }
  const q = list[S.i];
  const last = S.i === list.length - 1;
  const rev = revealed(q);
  const next = (primary) =>
    `<button type="button" class="btn${primary ? " primary" : ""}" data-act="next" ${last ? "disabled" : ""}>Next</button>`;
  let right = "";
  if (S.mode === "practice") {
    if (!rev && q.multi) {
      right = `<button type="button" class="btn primary" data-act="check" ${answered(q) ? "" : "disabled"}>Check answer</button>${next(false)}`;
    } else if (rev && !isRight(q)) {
      right = `<button type="button" class="btn" data-act="retry">Try again</button>${next(true)}`;
    } else {
      right = next(rev);
    }
  } else {
    right = next(false) + (S.graded ? "" : `<button type="button" class="btn primary" data-act="finish">Finish exam</button>`);
  }
  $("nav").innerHTML =
    `<button type="button" class="btn" data-act="prev" ${S.i === 0 ? "disabled" : ""}>Previous</button>
     <div class="right-group">${right}</div>`;
}

function renderGrid(list) {
  $("grid").innerHTML = list.map((q, idx) => {
    let cls = "";
    if (revealed(q)) cls = isRight(q) ? "right" : "wrong";
    else if (answered(q)) cls = "answered";
    if (idx === S.i) cls += " current";
    return `<button type="button" class="${cls}" data-i="${idx}" aria-label="Question ${idx + 1}">${idx + 1}</button>`;
  }).join("");
}

function go(i) {
  S.i = i;
  save();
  render();
  window.scrollTo(0, 0);
}

function choose(origIdx) {
  const q = visible()[S.i];
  if (!q || revealed(q) || origIdx < 0 || origIdx >= q.opts.length) return;
  let s = S.sel[q.id] || [];
  if (q.multi) {
    s = s.includes(origIdx) ? s.filter((x) => x !== origIdx) : [...s, origIdx];
  } else {
    s = [origIdx];
    if (S.mode === "practice") S.done[q.id] = true;
  }
  S.sel[q.id] = s;
  save();
  render();
  announce(q);
  const btn = document.querySelector(`.opt[data-k="${origIdx}"]`);
  if (btn) btn.focus({ preventScroll: true });
}

function announce(q) {
  $("sr").textContent = revealed(q)
    ? (isRight(q) ? "Correct." : `Incorrect. The answer is ${letterList(q, q.ans)}.`)
    : "";
}

function finishExam() {
  const open = scope().filter((q) => !answered(q)).length;
  if (open && !confirm(`${open} question${open === 1 ? " is" : "s are"} unanswered. Finish anyway?`)) return;
  S.graded = true;
  S.i = 0;
  save();
  render();
  window.scrollTo(0, 0);
}

function clearAnswers() {
  S.sel = {}; S.done = {}; S.graded = false; S.only = null; S.i = 0;
}

function setMode(mode) {
  if (mode === S.mode) return;
  if (Object.keys(S.sel).length && !confirm("Switching mode clears your answers. Continue?")) return;
  S.mode = mode;
  clearAnswers();
  save();
  render();
}

function answerKey() {
  const out = ["Computer Network Technology Quiz: Answer Key", ""];
  visible().forEach((q, n) => {
    out.push(`${n + 1}. [${q.id}] ${q.q}`);
    if (q.code) out.push(...q.code.split("\n").map((l) => "   " + l));
    const ord = S.optOrder[q.id] || q.opts.map((_, i) => i);
    ord.forEach((origIdx, pos) => out.push(`   ${LETTERS[pos]}. ${stripOpt(q.opts[origIdx])}`));
    out.push(`   Answer: ${letterList(q, q.ans)}`, `   ${q.why}`, "");
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out.join("\n")], { type: "text/plain;charset=utf-8" }));
  a.download = "network-midterm-answer-key.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

function act(name) {
  const list = visible();
  const q = list[S.i];
  if (name === "prev" && S.i > 0) go(S.i - 1);
  else if (name === "next" && S.i < list.length - 1) go(S.i + 1);
  else if (name === "check" && q && answered(q)) { S.done[q.id] = true; save(); render(); announce(q); }
  else if (name === "retry" && q) { delete S.sel[q.id]; delete S.done[q.id]; save(); render(); }
  else if (name === "finish") finishExam();
  else if (name === "review") { S.only = missed().map((m) => m.id); S.i = 0; save(); render(); }
  else if (name === "restart") { clearAnswers(); save(); render(); window.scrollTo(0, 0); }
}

document.addEventListener("click", (e) => {
  const opt = e.target.closest(".opt");
  if (opt) return choose(Number(opt.dataset.k));
  const cell = e.target.closest("#grid button");
  if (cell) return go(Number(cell.dataset.i));
  const btn = e.target.closest("[data-act]");
  if (btn) act(btn.dataset.act);
});

$("topic").onchange = (e) => { S.topic = e.target.value; S.only = null; S.i = 0; save(); render(); };
$("m-practice").onclick = () => setMode("practice");
$("m-exam").onclick = () => setMode("exam");
$("f-missed").onclick = () => {
  S.only = S.only ? null : missed().map((q) => q.id);
  S.i = 0;
  save();
  render();
};
$("f-shuffle").onclick = () => {
  const o = S.order;
  for (let i = o.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [o[i], o[j]] = [o[j], o[i]];
  }
  S.optOrder = makeAllOptOrders();
  S.i = 0;
  save();
  render();
};
$("f-key").onclick = answerKey;
$("f-reset").onclick = () => {
  if (!confirm("Clear all answers and start over?")) return;
  S = fresh();
  save();
  render();
};

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") act("next");
  else if (e.key === "ArrowLeft") act("prev");
  else if (/^[a-dA-D]$/.test(e.key)) {
    const q = visible()[S.i];
    const pos = LETTERS.indexOf(e.key.toUpperCase());
    const ord = q && S.optOrder[q.id];
    if (ord && pos >= 0 && pos < ord.length) choose(ord[pos]);
  } else if (/^[1-4]$/.test(e.key)) {
    const q = visible()[S.i];
    const pos = Number(e.key) - 1;
    const ord = q && S.optOrder[q.id];
    if (ord && pos < ord.length) choose(ord[pos]);
  }
});

render();
</script>
</body>
